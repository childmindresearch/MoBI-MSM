[project]
name = "mobi-msm"
version = "0.1.0"
description = "Participant-facing scenario-response task for the MoBI-MSM protocol"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "litellm>=1.65",
    # LiteLLM's retry wrapper (num_retries) imports tenacity lazily and is not
    # declared by litellm itself; without it a retryable API error fails the turn.
    "tenacity>=8.2",
]

[project.optional-dependencies]
lsl = ["pylsl>=1.16"]
# Reading recordings back, which is a different machine's job from streaming them.
analysis = ["pyxdf>=1.16"]
dev = ["pytest>=8.3", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
