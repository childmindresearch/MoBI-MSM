[project]
name = "mobi-msm"
version = "0.1.0"
description = "Participant-facing scenario-response task for the MoBI-MSM protocol"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "anthropic>=0.40",
]

[project.optional-dependencies]
lsl = ["pylsl>=1.16"]
dev = ["pytest>=8.3", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
